apiVersion: v1
kind: ConfigMap
metadata:
  name: yaml-config
data:
  config.yaml: |
    app:
      name: "my-app"
      version: "1.0.0"
    database:
      host: "localhost"
      port: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: yaml-pod
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: yaml-volume
      mountPath: /etc/config
  volumes:
  - name: yaml-volume
    configMap:
      name: yaml-config